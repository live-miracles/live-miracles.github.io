name: Publish website

on:
    push:
        branches:
            - master
    workflow_dispatch:
    # Project pages are built from each repository's README, so rebuild daily to
    # pick up README changes made in the project repositories.
    schedule:
        - cron: '17 3 * * *'

permissions:
    contents: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish to gh-pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ./dist
